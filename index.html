<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Üretim Takip</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #f4f5f7; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 1.6rem; font-weight: 600; padding: 0 16px; text-align: center; }
</style>
</head>
<body>
<h1>Sistem kapatılmıştır.</h1>
<script>
/* The browser keeps this page cached for ~10 min after the site reopens. Check the live
   page bypassing the cache; once it is no longer this one, reload into the real app. */
function kontrol(){
  fetch(location.href,{cache:"reload"}).then(function(r){return r.text();}).then(function(t){
    if(t.indexOf("Sistem kapatılmıştır.")<0) location.reload();
  }).catch(function(){});
}
kontrol();
setInterval(kontrol,30000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) kontrol(); });
</script>
</body>
</html>
